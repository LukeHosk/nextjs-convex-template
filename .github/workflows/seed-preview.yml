name: Seed Preview Deployment

on:
  deployment_status:

jobs:
  seed:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Seed preview test user
        run: |
          echo "Target URL: ${{ github.event.deployment_status.environment_url }}/api/seed"
          echo "Environment: ${{ github.event.deployment.environment }}"
          RESPONSE=$(curl -s -w "\n---HTTP_STATUS: %{http_code}---" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SEED_SECRET }}" \
            -H "Content-Type: application/json" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" \
            "${{ github.event.deployment_status.environment_url }}/api/seed")
          echo "Response: $RESPONSE"
          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS: [0-9]*' | grep -o '[0-9]*')
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Seed request failed with status $HTTP_STATUS"
            exit 1
          fi
